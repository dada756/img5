name: Image CDN Load Tester

on:
  workflow_dispatch:
    inputs:
      total_requests:
        description: "Total number of requests to make"
        required: true
        default: "5000"
      sleep_duration:
        description: "Sleep duration between requests"
        required: true
        default: "1"

jobs:
  execute-load-test:
    runs-on: ubuntu-latest

    steps:
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install HTTP/2 Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "httpx[http2]==0.27.0"

      - name: 🔨 Generate & Run Load Tester
        env:
          TOTAL_REQUESTS: ${{ github.event.inputs.total_requests }}
          SLEEP_DURATION: ${{ github.event.inputs.sleep_duration }}
          # Force Python to stream outputs instantly in GitHub Actions
          PYTHONUNBUFFERED: "1" 
        run: |
          cat << 'EOF' > load_tester.py
          import httpx
          import random
          import time
          import os

          # ---------------------------------------------------------
          # ⚙️ CONFIGURATION
          # ---------------------------------------------------------
          TOTAL_REQUESTS = int(os.environ.get("TOTAL_REQUESTS", 500))
          SLEEP_DURATION = float(os.environ.get("SLEEP_DURATION", 0.5))

          # ⚠️ PASTE YOUR TOP 50 IMAGE URLS HERE ⚠️
          IMAGE_URLS = [
              "https://media.moctale.in/images/1c8c57dc-fdf8-4d15-9004-ad5e44087079.jpg",
              "https://media.moctale.in/images/35c3b9fe-a40f-4935-a3df-752c7918e215.jpg",
              "https://media.moctale.in/images/91f21ad9-64ee-4dae-b9f2-caa3a34047dd.jpg",
              "https://media.moctale.in/images/5d2241f4-4360-40af-9b92-f99193d22d6c.jpg",
              "https://media.moctale.in/images/dd5bfdae-9123-432c-8ee1-01dec3dfd60f.jpg",
              "https://media.moctale.in/images/122c3a0c-af58-4528-8f63-b179e9c08f60.jpg",
              "https://media.moctale.in/images/289567a5-926c-4ed2-b0be-a0a05f26b06f.jpg",
              "https://media.moctale.in/images/d21dbbf0-7b52-470f-ae67-5eea678a82ac.jpg"
          ]

          def run_load_test():
              if not IMAGE_URLS or IMAGE_URLS[0] == "":
                  print("❌ Error: Please add URLs to the IMAGE_URLS list in the YAML file.", flush=True)
                  return

              print(f"🚀 Starting Load Test: {TOTAL_REQUESTS} requests, {SLEEP_DURATION}s delay...", flush=True)
              print("-" * 80, flush=True)

              with httpx.Client(http2=True, timeout=15.0) as client:
                  for i in range(TOTAL_REQUESTS):
                      url = random.choice(IMAGE_URLS)
                      random_q = f"{random.uniform(0.1, 99.0):.6f}"
                      
                      headers = {
                          "Host": "media.moctale.in",
                          "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Safari/537.36",
                          "Accept": f"image/png;q={random_q}",
                          "Sec-Fetch-Site": "same-site",
                          "Sec-Fetch-Mode": "no-cors",
                          "Sec-Fetch-Dest": "image",
                          "Referer": "https://moctale.in/",
                          "Priority": "0",
                          "Cache-Control": "no-cache",
                          "Pragma": "no-cache"
                      }

                      try:
                          response = client.get(url, headers=headers)
                          x_cache = response.headers.get("x-cache", "No-Cache-Header")
                          status_code = response.status_code
                          
                          # Distinct logging based on status code
                          if status_code == 200:
                              print(f"[{x_cache}] [{status_code}] [{url}]", flush=True)
                          else:
                              print(f"❌ [ERROR] [{x_cache}] [HTTP {status_code}] [{url}] -> Response: {response.text[:100]}", flush=True)
                              
                      except Exception as e:
                          print(f"⚠️ [NETWORK ERROR] [000] [{url}] -> {str(e)}", flush=True)

                      if i < TOTAL_REQUESTS - 1:
                          time.sleep(SLEEP_DURATION)
                          
              print("-" * 80, flush=True)
              print("✅ Load Test Completed Successfully.", flush=True)

          if __name__ == "__main__":
              run_load_test()
          EOF

          # The -u flag ensures unbuffered binary stdout and stderr
          python -u load_tester.py
